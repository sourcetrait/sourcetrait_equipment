key = "empower"
title = "SourceTrait Empower"
version = "0.0.0-2"

[author]
key = "sourcetrait"
title = "SourceTrait"
email = "development@sourcetrait.com"

[details]
summary = "Empower rig"
keywords = ["ai"]

[license]
spdx = "AGPL-3.0-or-later"
file = "LICENSE-AGPL-3.txt"

[support]
nushell.version = "0.113"
equipment.version = "0"

[[repository]]
key = "git/sourcetrait/empower"
kind = "git"
read.provider = "github"
read.uri = "https://github.com/sourcetrait/empower_equipment.git"
read.reference = "draft/roylaurie"
write.provider = "github"
write.uri = "ssh://git@github.com:sourcetrait/empower_equipment.git"
write.reference = "draft/roylaurie"

[export]
rig = [
    "sourcetrait/ant",
    "sourcetrait/drone",
    "sourcetrait/equip",
    "sourcetrait/empower",
    "sourcetrait/fae",
    "sourcetrait/queen"
]
gear.box = [
    "sourcetrait/empwr"
]
gear.desk = [
    "sourcetrait/empwr"
]
gear.lib = [
    "sourcetrait/lib_empwr"
]
bag = [
    "sourcetrait/empower/olmo/know_rust",
    "sourcetrait/empower/role"
]

[[import.repository]]
key = "git/sourcetrait/equipment"
kind = "git"
read.provider = "github"
read.uri = "https://github.com/sourcetrait/equipment_equipment.git"
