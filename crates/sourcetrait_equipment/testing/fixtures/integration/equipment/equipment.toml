store.cid = "bafkreigh6aess6gkvwadzqlfkxxeyzfofn67g63dkbtruy3ffyl7p65opa"

[[import.gear]]
key = "sourcetrait/eqp"
version = "0"
repository = "git/sourcetrait/equipment"

[[import.bag]]
