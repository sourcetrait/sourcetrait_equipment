key = "empower"
title = "SourceTrait Empower"
version = "0.0.0-2"

[support]
nushell.version = "0.113"
equipment.version = "0"

[author]
key = "sourcetrait"
title = "SourceTrait"
email = "development@sourcetrait.com"

[details]
summary = "Empower rig"
keywords = ["ai"]

[license]
spdx = "AGPL-3.0-or-later"
file = "LICENSE-AGPL-3.txt"

[provider]
key = "github/sourcetrait"
reference = "dev"
mirror.uri = "https://github.com/sourcetrait"
contribute.uri = "ssh://git@github.com/sourcetrait"

[exports]
libraries = [
    "sourcetrait/ant",
    "sourcetrait/drone",
    "sourcetrait/equip",
    "sourcetrait/empower",
    "sourcetrait/fae",
    "sourcetrait/queen"
]

[[imports.provider]]
key = "github/sourcetrait"
provider = "github"
account = "sourcetrait"
mirror.uri = "https://github.com/sourcetrait"
contribute.uri = "ssh://git@github.com:sourcetrait"

[[imports.rig]]
key = "sourcetrait/equipment"
provider.key = "github/sourcetrait"
provider.mirror.path = "equip.git"
provider.contribute.path = "equip.git"
provider.reference = "dev"

[[imports.library]]
rig = "sourcetrait/equipment"
library = "sourcetrait/equipment"
version = "0"

